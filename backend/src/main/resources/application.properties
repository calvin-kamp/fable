spring.application.name=fable-backend

# Load local environment variables from .env (optional, not present in production)
spring.config.import=optional:file:.env[.properties]

# JWT signing key, Base64-encoded, at least 32 bytes
jwt.secret=${JWT_SECRET}

# Allowed frontend origins, comma-separated
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Schema is managed by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate

# Include error messages and validation errors in error responses
server.error.include-message=always
server.error.include-binding-errors=always
